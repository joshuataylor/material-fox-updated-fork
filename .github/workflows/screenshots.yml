# Per-feature chrome screenshots across Stable/Beta/Nightly, supported OS, uploaded for manual visual regression inspection.
#
# Two macOS versions on purpose: 15 and 26 render native controls differently.
# `mise run download-firefox` is a single cross-platform Node script, so every OS uses the same step (yay).
name: screenshots

on:
  workflow_dispatch:
    inputs:
      os:
        description: OS to run
        type: choice
        default: all
        options:
          - all
          - ubuntu-26.04
          - windows-2025
          - macos-15
          - macos-26
      channel:
        description: Firefox channel to run
        type: choice
        default: all
        options:
          - all
          - nightly
          - beta
          - stable
  # to test before merge.
#  pull_request:

permissions:
  contents: read

jobs:
  # Turn the os/channel inputs into JSON matrix axes. "all" (or an empty value,
  # e.g. a non-dispatch trigger) expands to the full set.
  setup:
    runs-on: ubuntu-26.04
    outputs:
      os: ${{ steps.axes.outputs.os }}
      channel: ${{ steps.axes.outputs.channel }}
    steps:
      - id: axes
        shell: bash
        env:
          IN_OS: ${{ inputs.os }}
          IN_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -z "$IN_OS" ] || [ "$IN_OS" = "all" ]; then
            echo 'os=["ubuntu-26.04","windows-2025","macos-15","macos-26"]' >> "$GITHUB_OUTPUT"
          else
            echo "os=[\"$IN_OS\"]" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$IN_CHANNEL" ] || [ "$IN_CHANNEL" = "all" ]; then
            echo 'channel=["nightly","beta","stable"]' >> "$GITHUB_OUTPUT"
          else
            echo "channel=[\"$IN_CHANNEL\"]" >> "$GITHUB_OUTPUT"
          fi

  screenshots:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os) }}
        channel: ${{ fromJSON(needs.setup.outputs.channel) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4.3.0
        with:
          experimental: 'true'

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node_modules-

      - name: mise run npm_install
        run: mise run npm_install

      - name: mise run build
        run: mise run build

      - name: Restore Firefox cache (${{ matrix.channel }})
        uses: actions/cache/restore@v6
        with:
          path: tmp/firefox
          key: firefox-${{ runner.os }}-${{ matrix.channel }}
          restore-keys: firefox-${{ runner.os }}-${{ matrix.channel }}-

      - name: Download Firefox (${{ matrix.channel }})
        run: mise run download-firefox --channel ${{ matrix.channel }}

      # tmp/firefox/nightly/.identity is for example `buildid:20260913084423`
      # So we can use this as the key to the specific build of Firefox we downloaded.
      # We restore using the channel only, but this lets us specifically cache build downloaded.
      - name: Firefox cache key (${{ matrix.channel }})
        id: ff-id
        shell: bash
        run: |
          f="tmp/firefox/${{ matrix.channel }}/.identity"
          [ -f "$f" ] && echo "key=firefox-${{ runner.os }}-${{ matrix.channel }}-$(tr ':' '-' < "$f")" >> "$GITHUB_OUTPUT"

      - name: Save Firefox cache (${{ matrix.channel }})
        if: steps.ff-id.outputs.key != ''
        uses: actions/cache/save@v6
        with:
          path: tmp/firefox
          key: ${{ steps.ff-id.outputs.key }}

      # Force a consistent display resolution so the fullScreen popup grabs are a
      # predictable size (GitHub does not pin runner resolution; macOS in
      # particular varies per job -- actions/runner-images#9345). Best-effort:
      # non-fatal, since the capture works at the default resolution too. Linux is
      # handled by the Xvfb `-screen` args in the headful step below.
      - name: Force display resolution (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: .github/scripts/set-resolution.ps1 -Width 1920 -Height 1080

      - name: Force display resolution (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          brew install displayplacer || true
          id=$(displayplacer list | awk -F': ' '/Persistent screen id/{print $2; exit}')
          echo "display id: $id"
          displayplacer "id:$id res:1920x1080 scaling:off origin:(0,0) degree:0" \
            || echo "displayplacer could not set a resolution; leaving default"

      - name: Capture screenshots (${{ matrix.channel }})
        run: mise run screenshots -- --channels ${{ matrix.channel }}

      # scrot grabs the whole Xvfb display for shots whose popup is a native
      # window (fullScreen shots), which geckodriver's own screenshots miss.
      - name: Install screen grabber (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y scrot

      - name: Capture panels non-headless (${{ matrix.channel }})
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" mise run screenshots -- --channels ${{ matrix.channel }} --headful-only
          else
            mise run screenshots -- --channels ${{ matrix.channel }} --headful-only
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.channel }}
          path: tmp/screenshots/
          if-no-files-found: error

  # Merge the per-OS/channel artifacts into one downloadable ZIP once the matrix
  # is done. The flat filenames carry OS + channel + scheme, so everything sits in
  # a single directory without colliding. `!cancelled()` still bundles whatever
  # succeeded when a matrix leg fails (fail-fast is off); delete-merged drops the
  # 12 intermediate artifacts, leaving just `screenshots-all`.
  bundle:
    needs: screenshots
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Merge screenshots into a single artifact
        uses: actions/upload-artifact/merge@v7
        with:
          name: screenshots-all
          pattern: screenshots-*
          delete-merged: true

<svg width="16" height="16" xmlns="http://www.w3.org/2000/svg"><style>:root{--radius:calc(2 * 3.1415926536 * 37.5%);--gap:calc(var(--radius) * .25)}</style><circle cx="50%" cy="50%" r="37.5%" style="fill:transparent;stroke:context-fill;stroke-width:12.5%;stroke-dasharray:var(--radius);stroke-dashoffset:var(--gap);stroke-linecap:round"/></svg>
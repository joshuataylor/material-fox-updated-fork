name: Publish New Release

on:
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies and build project
        run: |
          sudo apt-get update && sudo apt-get install -y jq zip && npm install && npm run build
        continue-on-error: false # Stop the workflow if npm run build fails

      - name: Add chrome folder to archive
        run: |
          zip -r chrome.zip chrome
        working-directory: ${{ github.workspace }}

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create version tag
        env:
          VERSION: ${{ env.VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${VERSION}"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          git fetch --tags
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. Skipping tag creation."
          else
            git tag "$TAG_NAME"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG_NAME"
          fi

      - name: Create and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: |
          gh release create "$TAG_NAME" chrome.zip \
            --title "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY"

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4.3.0
        with:
          experimental: "true"

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node_modules-

      - name: mise run npm_install
        run: mise run npm_install

      - name: mise run build
        run: mise run build

      - name: mise run lint
        run: mise run lint
